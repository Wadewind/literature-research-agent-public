[project]
name = "agent-service"
version = "0.1.0"
description = "Backend service for the literature review agent system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.5",
    "arq>=0.28,<0.29",
    "docling>=2.120.3",
    "fastapi>=0.141.1",
    "httpx2>=2.10.0",
    "langgraph>=1.2.10",
    "psycopg[binary]>=3.2.9",
    "pydantic>=2,<3",
    "pypdf>=6.16.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.43",
    "uvicorn[standard]>=0.52.2",
]

[project.scripts]
agent-service = "literature_agent.__main__:main"
agent-worker = "literature_agent.worker:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "literature_agent"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.10.2",
    "nbformat>=5.10.4",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx2>=1.0.0",
    "ruff>=0.16.2",
    "testcontainers[postgres]>=4.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
