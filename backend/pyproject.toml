[project]
name = "agent-service"
version = "0.1.0"
description = "Backend service for the literature review agent system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2.10",
]

[project.scripts]
agent-service = "literature_agent.__main__:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "literature_agent"
